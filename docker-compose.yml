services:
  db:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - telemetry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: telemetry-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry@db:5432/telemetry?schema=public
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  telemetry_pgdata:
